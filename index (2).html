<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crisper — App Prototype (Light)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7F4;
  --surface:#FFFFFF;
  --surface-2:#F0F4F0;
  --surface-3:#E7EDE8;
  --line:#DDE5DE;
  --line-soft:#EAF0EB;

  --text:#132018;
  --muted:#5A6B61;
  --dim:#8B9890;

  --fresh:#12A05C;
  --soon:#C98407;
  --expired:#D6373E;
  --accent:#12A05C;
  --accent-soft:#E6F5EC;

  --display:'Space Grotesk','Inter',system-ui,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;

  --t-label:11px;
  --t-meta:12.5px;
  --t-body:14px;
  --t-lead:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#E8EEE9;color:var(--text);font-family:var(--body);
  font-size:var(--t-body);line-height:1.55;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;font-size:inherit}
input{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

.app{
  width:100%;height:100%;max-width:430px;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:460px) and (min-height:720px){
  body{padding:22px}
  .app{height:min(900px,100%);border-radius:40px;border:1px solid var(--line);
       box-shadow:0 30px 70px rgba(19,32,24,.16)}
}

.statusbar{display:flex;justify-content:space-between;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 22px 3px;font-family:var(--display);
  font-size:var(--t-label);color:var(--dim);flex:none}

.apphead{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:5px 18px 14px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.brand b{display:block;font-family:var(--display);letter-spacing:.16em;font-size:15px;font-weight:700}
.brand small{display:block;color:var(--dim);font-size:var(--t-meta);margin-top:2px}
.headbtns{display:flex;gap:7px}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--surface);
  border:1px solid var(--line);display:grid;place-items:center;font-size:14px;
  position:relative;transition:border-color .15s,background .15s;flex:none}
.icon-btn:hover{border-color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--expired);color:#fff;font-family:var(--display);
  font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--bg)}

.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 24px;
  -webkit-overflow-scrolling:touch;scrollbar-width:thin;scroll-padding-top:38px}
.screen::-webkit-scrollbar{width:4px}
.screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.screen-pad{padding-top:15px}

.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);
  background:var(--surface);padding:8px 6px calc(12px + env(safe-area-inset-bottom));flex:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;
  font-family:var(--display);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--dim);border-radius:10px;transition:color .15s}
.tab i{font-style:normal;font-size:17px;line-height:1;filter:grayscale(1) opacity(.45);transition:.15s}
.tab[aria-selected=true]{color:var(--text)}
.tab[aria-selected=true] i{filter:none}
.tab[aria-selected=true]::after{content:"";width:14px;height:2px;border-radius:2px;background:var(--accent)}

.h1{font-family:var(--display);font-size:var(--t-lead);font-weight:700;
  margin:2px 0 3px;letter-spacing:-.015em;line-height:1.2}
.sub{color:var(--muted);font-size:var(--t-meta);margin:0 0 14px}
.sec{position:sticky;top:0;z-index:5;
  font-family:var(--display);font-size:var(--t-label);letter-spacing:.15em;text-transform:uppercase;
  font-weight:600;color:var(--dim);margin:18px -16px 9px;padding:7px 16px;
  background:rgba(244,247,244,.95);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec .count{color:var(--dim)}
.sec.flat{position:static;background:none;backdrop-filter:none;margin:18px 0 9px;padding:0}
.note{font-size:var(--t-meta);color:var(--dim);line-height:1.6}
.measure{max-width:34ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.row{display:flex;align-items:center;gap:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tally{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);
  border-radius:14px;overflow:hidden;margin-bottom:9px;background:var(--surface)}
.tally button{padding:11px 4px;text-align:center;border-right:1px solid var(--line-soft);transition:background .15s}
.tally button:last-child{border-right:0}
.tally button:hover,.tally button[aria-pressed=true]{background:var(--surface-2)}
.tally b{display:block;font-family:var(--display);font-size:19px;font-weight:700;color:var(--c);line-height:1}
.tally span{display:block;font-size:10px;color:var(--dim);margin-top:5px}
.valuebar{display:flex;justify-content:space-between;align-items:baseline;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;margin-bottom:12px;font-size:var(--t-meta);color:var(--muted)}
.valuebar b{font-family:var(--display);font-size:15px;color:var(--text);font-weight:700}

.ring{width:42px;height:42px;flex:none;border-radius:50%;position:relative;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%), var(--surface-3) 0)}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.ring em{position:relative;z-index:1;font-style:normal;font-size:18px;line-height:1}
.ring.lg{width:68px;height:68px}
.ring.lg em{font-size:29px}

.item{display:grid;grid-template-columns:42px 1fr 52px;align-items:center;gap:12px;
  width:100%;text-align:left;padding:11px 13px;margin-bottom:7px;
  background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);
  border-radius:14px;transition:border-color .15s,background .15s}
.item:hover{background:var(--surface-2)}
.item .m{min-width:0}
.item .n{font-size:var(--t-body);font-weight:600;line-height:1.3;
  display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .s{color:var(--muted);font-size:var(--t-meta);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .d{text-align:right}
.item .d b{display:block;font-family:var(--display);font-size:var(--t-lead);font-weight:700;
  line-height:1;color:var(--c)}
.item .d span{display:block;font-size:9px;letter-spacing:.11em;color:var(--dim);margin-top:3px}

.tag{font-size:10px;padding:2px 7px;border-radius:5px;border:1px solid var(--line);
  color:var(--muted);font-weight:600;letter-spacing:.04em;line-height:1.5;background:var(--surface-2)}
.tag.warn{border-color:rgba(201,132,7,.45);color:var(--soon);background:#FDF5E6}
.tag.new{border-color:rgba(18,160,92,.4);color:var(--accent);background:var(--accent-soft)}

.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;
  margin-bottom:11px;background:var(--surface)}
.seg button{flex:1;padding:9px 4px;font-size:13px;color:var(--muted);transition:background .15s}
.seg button[aria-pressed=true]{background:var(--surface-3);color:var(--text);font-weight:600}

.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:10px 13px;color:var(--text);font-size:13.5px;margin-bottom:11px}
.search::placeholder{color:var(--dim)}

.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:12px;
  font-family:var(--display);font-size:13px;font-weight:600;
  border:1px solid var(--line);background:var(--surface);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn-pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-pri:hover{background:#0E8B4F;color:#fff;border-color:#0E8B4F}
.btn-dng{border-color:rgba(214,55,62,.35);color:var(--expired);background:#FDF0F0}
.btn-dng:hover{border-color:var(--expired);color:var(--expired);background:#FBE4E5}

.kvl{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:13px}
.kvl:last-child{border-bottom:0;padding-bottom:0}
.kvl:first-child{padding-top:0}
.kvl>span{color:var(--muted)}
.kvl b{font-family:var(--display);font-weight:600}
.kvl b.ok{color:var(--fresh)}

.device{height:92px;border-radius:14px;position:relative;overflow:hidden;
  background:linear-gradient(145deg,#EDF3EE,#DCE6DE);border:1px solid var(--line)}
.device .lens{position:absolute;left:20px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;border-radius:50%;background:#132018;border:1px solid #2C3B32}
.device .lens::after{content:"";position:absolute;inset:11px;border-radius:50%;
  background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.device .beam{position:absolute;left:54px;right:10px;top:0;bottom:0;
  background:linear-gradient(90deg,rgba(18,160,92,.14),transparent 70%)}
.device .led{position:absolute;right:16px;top:15px;width:7px;height:7px;border-radius:50%;background:var(--fresh)}
.device .mark{position:absolute;right:16px;bottom:12px;font-family:var(--display);
  font-size:9.5px;letter-spacing:.2em;color:var(--dim)}

.step{display:grid;grid-template-columns:22px 1fr;gap:10px;margin-bottom:13px}
.step:last-child{margin-bottom:0}
.step>b{font-family:var(--display);color:var(--accent);font-size:var(--t-label);
  font-weight:700;letter-spacing:.06em;padding-top:2px}
.step p{margin:0;font-size:var(--t-meta);color:var(--muted);line-height:1.6;max-width:34ch}
.step p b{color:var(--text);font-weight:600}

.legend{display:flex;align-items:flex-start;gap:10px;padding:7px 0;
  font-size:var(--t-meta);color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;flex:none;margin-top:5px;font-style:normal}
.legend b{color:var(--text);font-weight:600}

.viewport{position:relative;height:210px;border-radius:18px;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;text-align:center}
.grid-bg{position:absolute;inset:0;opacity:.55;
  background-image:linear-gradient(rgba(18,160,92,.09) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(18,160,92,.09) 1px,transparent 1px);
  background-size:26px 26px}
.corner{position:absolute;width:22px;height:22px;border:2px solid var(--accent);opacity:.65}
.c1{top:14px;left:14px;border-right:0;border-bottom:0;border-radius:7px 0 0 0}
.c2{top:14px;right:14px;border-left:0;border-bottom:0;border-radius:0 7px 0 0}
.c3{bottom:14px;left:14px;border-right:0;border-top:0;border-radius:0 0 0 7px}
.c4{bottom:14px;right:14px;border-left:0;border-top:0;border-radius:0 0 7px 0}
.scanline{position:absolute;left:12px;right:12px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent);
  animation:sweep 2.1s cubic-bezier(.45,0,.55,1) infinite}
@keyframes sweep{0%,100%{top:20px}50%{top:188px}}
.vp-copy{position:relative;z-index:2;padding:16px}
.vp-copy .big{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:5px}
.vp-copy .small{color:var(--muted);font-size:var(--t-meta);line-height:1.55;max-width:32ch;margin:0 auto}
.bars{display:flex;gap:2px;justify-content:center;height:30px;margin-bottom:10px}
.bars i{display:block;width:2.5px;background:var(--text);border-radius:1px;opacity:.85}

.chip{font-size:12px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);
  color:var(--muted);background:var(--surface);transition:border-color .15s,color .15s,background .15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

.log{display:flex;justify-content:space-between;gap:12px;font-size:var(--t-meta);padding:8px 0;
  border-bottom:1px solid var(--line-soft);color:var(--dim)}
.log:last-child{border-bottom:0;padding-bottom:0}
.log:first-child{padding-top:0}
.log b{color:var(--text);font-weight:600}

.stepper{display:flex;align-items:center;gap:8px;border:1px solid var(--line);
  border-radius:10px;padding:4px 9px;background:var(--surface)}
.stepper button{width:20px;font-size:15px;color:var(--muted)}
.stepper button:hover{color:var(--accent)}
.stepper b{font-family:var(--display);font-size:13px;min-width:34px;text-align:center}

.recipe{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:8px}
.recipe h4{margin:0 0 3px;font-family:var(--display);font-size:15px;font-weight:600}
.remoji{width:40px;height:40px;border-radius:11px;background:var(--surface-2);
  display:grid;place-items:center;font-size:20px;flex:none}
.ings{display:flex;flex-wrap:wrap;gap:5px;margin:11px 0}
.ing{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--surface-2);
  color:var(--muted);border:1px solid transparent}
.ing.use{border-color:rgba(201,132,7,.45);color:var(--soon);background:#FDF5E6}
.ing.bad{border-color:rgba(214,55,62,.4);color:var(--expired);background:#FDF0F0}
.ing.miss{border:1px dashed var(--line);color:var(--dim);background:transparent}

.lrow{display:flex;align-items:center;gap:11px;padding:10px 12px;background:var(--surface);
  border:1px solid var(--line);border-radius:13px;margin-bottom:7px}
.lrow.done{opacity:.45}
.lrow.done .ln{text-decoration:line-through}
.check{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--dim);flex:none;
  display:grid;place-items:center;font-size:12px;transition:.15s}
.lrow.done .check{background:var(--accent);border-color:var(--accent);color:#fff}
.ln{flex:1;font-size:13.5px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.stat .n{font-family:var(--display);font-size:25px;font-weight:700;line-height:1.05;letter-spacing:-.01em}
.stat .l{font-size:var(--t-meta);color:var(--dim);margin-top:5px;line-height:1.45}
.chart{display:flex;align-items:flex-end;gap:6px;height:106px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;height:100%}
.bar .f{border-radius:5px 5px 2px 2px;background:var(--surface-3)}
.bar .f.hot{background:var(--expired);opacity:.8}
.bar .f.good{background:var(--fresh);opacity:.8}
.bar span{font-size:9px;color:var(--dim);text-align:center;font-family:var(--display)}
.meter{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}

.backdrop{position:absolute;inset:0;background:rgba(19,32,24,.35);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .22s;z-index:60}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;z-index:61;
  background:var(--bg);border-top:1px solid var(--line);border-radius:24px 24px 0 0;
  padding:8px 18px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .28s cubic-bezier(.3,.9,.3,1);
  box-shadow:0 -14px 40px rgba(19,32,24,.14)}
.sheet.on{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:3px;background:var(--line);margin:5px auto 14px}
.sheet h3{font-family:var(--display);font-size:18px;font-weight:700;margin:0 0 3px}

input[type=range]{width:100%;accent-color:var(--accent);height:22px;margin:0}
.ticks{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);
  font-family:var(--display);letter-spacing:.1em;margin-top:-2px}
.tm-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.tm-head b{font-family:var(--display);font-size:26px;font-weight:700;line-height:1;letter-spacing:-.01em}
.tm-head span{color:var(--dim);font-size:var(--t-meta)}
.scn{display:flex;flex-direction:column;gap:7px;margin-top:16px}
.scn button{display:flex;align-items:center;gap:9px;text-align:left;padding:11px 13px;
  border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--muted);
  background:var(--surface);transition:border-color .15s,color .15s}
.scn button:hover{border-color:var(--accent);color:var(--text)}
.scn button i{font-style:normal;flex:none;width:16px;text-align:center}

.toasts{position:absolute;left:14px;right:14px;bottom:88px;z-index:99;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 15px;border-radius:11px;
  font-size:12.5px;font-weight:600;text-align:center;
  box-shadow:0 10px 26px rgba(19,32,24,.26);animation:pop .22s ease both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}

.empty{text-align:center;padding:40px 16px;color:var(--dim);font-size:13px}
.empty .e{font-size:34px;margin-bottom:10px;opacity:.55}
</style>
</head>
<body>

<div class="app">
  <div class="statusbar"><span>9:41</span><span>Kitchen · 82%</span></div>

  <header class="apphead">
    <div class="brand">
      <b>CRISPER</b>
      <small id="headSub">Home Kitchen · 2 members</small>
    </div>
    <div class="headbtns">
      <button class="icon-btn" id="labBtn" aria-label="Time machine">⏱</button>
      <button class="icon-btn" id="bellBtn" aria-label="Alerts">🔔<span class="badge" id="bellBadge">0</span></button>
      <button class="icon-btn" id="gearBtn" aria-label="Settings">⚙</button>
    </div>
  </header>

  <main class="screen" id="screen" role="tabpanel"></main>

  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-tab="fridge"   aria-selected="true"><i>🧊</i>Fridge</button>
    <button class="tab" role="tab" data-tab="scan"     aria-selected="false"><i>⌁</i>Scan</button>
    <button class="tab" role="tab" data-tab="rescue"   aria-selected="false"><i>🍳</i>Rescue</button>
    <button class="tab" role="tab" data-tab="list"     aria-selected="false"><i>🛒</i>List</button>
    <button class="tab" role="tab" data-tab="insights" aria-selected="false"><i>📈</i>Stats</button>
  </nav>

  <div class="toasts" id="toasts"></div>
  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<script>
const DAY=86400000;
const T0=(()=>{const d=new Date();d.setHours(0,0,0,0);return d.getTime();})();

const SEED=[
 ['Whole Milk','🥛','Dairy','Door',1.4,'L',2,3,10,3.49,2],
 ['Greek Yogurt','🍧','Dairy','Top Shelf',4,'cups',4,9,21,5.99,3],
 ['Eggs','🥚','Protein','Mid Shelf',5,'eggs',12,18,28,4.29,7],
 ['Baby Spinach','🥬','Produce','Crisper',1,'bag',1,1,7,3.99,1],
 ['Chicken Breast','🍗','Protein','Mid Shelf',450,'g',500,-1,4,8.49,400],
 ['Sharp Cheddar','🧀','Dairy','Door',1,'block',1,24,45,6.25,0.5],
 ['Strawberries','🍓','Produce','Crisper',1,'pint',1,2,6,4.99,1],
 ['Carrots','🥕','Produce','Crisper',8,'pcs',6,16,30,2.29,4],
 ['Orange Juice','🧃','Beverage','Door',0.3,'L',2,5,14,4.49,1.5],

let uid=1;
const makeItem=a=>({id:uid++,name:a[0],emoji:a[1],cat:a[2],zone:a[3],qty:a[4],unit:a[5],
  par:a[6],expires:T0+a[7]*DAY+DAY-1,shelf:a[8],price:a[9],use:a[10]||1,
  added:T0-Math.round(Math.random()*4)*DAY,fresh:false});

const state={tab:'fridge',items:[],list:[],log:[],history:[],offset:0,soonDays:5,
  filter:'all',group:'urgency',q:'',scanMode:'in',scanning:false,pending:null,saved:0,tossed:0};

function seed(){
  uid=1;
  state.items=SEED.map(makeItem);
  state.list=[{id:'l1',name:'Coffee beans',qty:1,auto:false,done:false},
              {id:'l2',name:'Olive oil',qty:1,auto:false,done:true}];
  state.log=[{t:'Almond Milk',d:'scanned in',ago:'2 min ago'},
             {t:'Eggs ×2',d:'taken out',ago:'1 hr ago'},
             {t:'Bell Peppers',d:'scanned in',ago:'Yesterday'}];
  state.history=[2,1,3,0,2,1,0,1];
  state.offset=0;state.saved=128.40;state.tossed=11.78;
  state.filter='all';state.q='';state.pending=null;
}
seed();

const now=()=>Date.now()+state.offset*DAY;
const daysLeft=it=>Math.floor((it.expires-now())/DAY);
const statusOf=it=>{const d=daysLeft(it);return d<0?'expired':d<=state.soonDays?'soon':'fresh';};
const COLOR={fresh:'var(--fresh)',soon:'var(--soon)',expired:'var(--expired)'};
const pct=it=>Math.max(0,Math.min(100,Math.round((daysLeft(it)+1)/it.shelf*100)));
const isLow=it=>it.par>0&&it.qty/it.par<=0.5;
function dayLabel(d){
  if(d<-1)return Math.abs(d)+' days ago';
  if(d===-1)return 'Yesterday';
  if(d===0)return 'Today';
  if(d===1)return 'Tomorrow';
  return 'in '+d+' days';
}
const money=n=>'$'+n.toFixed(2);
const qtyTxt=it=>(Math.round(it.qty*100)/100)+' '+it.unit;
const $=id=>document.getElementById(id);

const screen=$('screen');

function render(){
  const views={fridge:viewFridge,scan:viewScan,rescue:viewRescue,list:viewList,insights:viewInsights};
  screen.innerHTML='<div class="screen-pad">'+views[state.tab]()+'</div>';
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.tab===state.tab)));
  const c={fresh:0,soon:0,expired:0};
  state.items.forEach(i=>c[statusOf(i)]++);
  const low=state.items.filter(isLow).length;
  const n=c.expired+c.soon+low;
  $('bellBadge').textContent=n;
  $('bellBadge').style.display=n?'grid':'none';
  const d=new Date(now());
  $('headSub').textContent='Home Kitchen · '+
    (state.offset?('simulating '+d.toLocaleDateString(undefined,{month:'short',day:'numeric'})):'2 members');
  bindScreen();
}

function itemRow(it){
  const st=statusOf(it),d=daysLeft(it);
  return '<button class="item" data-item="'+it.id+'" style="--c:'+COLOR[st]+'">'+
    '<span class="ring" style="--p:'+pct(it)+';--c:'+COLOR[st]+'"><em>'+it.emoji+'</em></span>'+
    '<span class="m"><span class="n">'+it.name+
      (it.fresh?' <span class="tag new">NEW</span>':'')+
      (isLow(it)?' <span class="tag warn">LOW</span>':'')+'</span>'+
      '<span class="s">'+qtyTxt(it)+' · '+it.zone+' · '+dayLabel(d)+'</span></span>'+
    '<span class="d"><b>'+(d<0?'!':d)+'</b><span>'+(d<0?'GONE':(d===1?'DAY':'DAYS'))+'</span></span>'+
  '</button>';
}

function viewFridge(){
  let items=state.items.slice();
  if(state.q)items=items.filter(i=>(i.name+i.cat+i.zone).toLowerCase().includes(state.q.toLowerCase()));
  if(state.filter!=='all')
    items=state.filter==='low'?items.filter(isLow):items.filter(i=>statusOf(i)===state.filter);

  const c={fresh:0,soon:0,expired:0};
  state.items.forEach(i=>c[statusOf(i)]++);
  const lows=state.items.filter(isLow);
  const val=state.items.reduce((s,i)=>s+i.price*Math.min(1,i.qty/(i.par||1)),0);

  let body='';
  if(!items.length){
    body='<div class="empty"><div class="e">🧊</div>Nothing matches this view.</div>';
  } else if(state.group==='zone'){
    ZONES.forEach(z=>{
      const g=items.filter(i=>i.zone===z); if(!g.length)return;
      g.sort((a,b)=>daysLeft(a)-daysLeft(b));
      body+='<div class="sec">'+z+'<span class="count">'+g.length+'</span></div>'+g.map(itemRow).join('');
    });
  } else {
    [['expired','Expired'],['soon','Use within '+state.soonDays+' days'],['fresh','Plenty of time']]
    .forEach(([k,label])=>{
      const g=items.filter(i=>statusOf(i)===k); if(!g.length)return;
      g.sort((a,b)=>daysLeft(a)-daysLeft(b));
      body+='<div class="sec" style="color:'+COLOR[k]+'">'+label+'<span class="count">'+g.length+'</span></div>'+
            g.map(itemRow).join('');
    });
  }

  const tally=[['fresh',c.fresh,'Fresh','var(--fresh)'],['soon',c.soon,'Use soon','var(--soon)'],
               ['expired',c.expired,'Expired','var(--expired)'],['low',lows.length,'Low','var(--text)']]
    .map(([k,v,l,col])=>'<button data-filter="'+k+'" aria-pressed="'+(state.filter===k)+'" style="--c:'+col+'">'+
      '<b>'+v+'</b><span>'+l+'</span></button>').join('');

  return '<h1 class="h1">Your fridge</h1>'+
    '<p class="sub">'+state.items.length+' items tracked'+(state.offset?' · simulating +'+state.offset+' days':'')+'</p>'+
    '<div class="tally">'+tally+'</div>'+
    '<div class="valuebar"><span>Fridge value</span><b>'+money(val)+'</b></div>'+
    (lows.length?'<div class="card" style="margin-bottom:10px">'+
      '<div class="row" style="justify-content:space-between;margin-bottom:7px">'+
      '<b style="font-family:var(--display);font-size:13px">Running low · '+lows.length+'</b>'+
      '<button class="chip" data-act="addAllLow">Add all to list</button></div>'+
      '<p class="note" style="margin:0">'+lows.map(i=>i.name).join(' · ')+'</p></div>':'')+
    '<input class="search" id="q" placeholder="Search items, shelves, categories" value="'+state.q.replace(/"/g,'&quot;')+'">'+
    '<div class="seg"><button data-group="urgency" aria-pressed="'+(state.group==='urgency')+'">By urgency</button>'+
      '<button data-group="zone" aria-pressed="'+(state.group==='zone')+'">By shelf</button></div>'+
    (state.filter!=='all'?'<button class="btn" data-filter="all" style="margin-bottom:10px">Show all '+state.items.length+'</button>':'')+
    body;
}

function viewRescue(){
  const byName=Object.fromEntries(state.items.map(i=>[i.name,i]));
  const scored=RECIPES.map(r=>{
    let rescue=0,bad=0,have=0;
    r.ing.forEach(n=>{const it=byName[n];if(!it)return;have++;
      const s=statusOf(it);if(s==='soon')rescue++;if(s==='expired')bad++;});
    return {...r,rescue,bad,have,miss:r.ing.length-have};
  }).sort((a,b)=>(b.rescue-a.rescue)||(a.miss-b.miss));

  const urgent=state.items.filter(i=>statusOf(i)==='soon').sort((a,b)=>daysLeft(a)-daysLeft(b));
  const dead=state.items.filter(i=>statusOf(i)==='expired');

  return '<h1 class="h1">Rescue</h1>'+
    '<p class="sub">'+urgent.length+' items need eating within '+state.soonDays+' days.</p>'+
    (dead.length?'<div class="card" style="margin-bottom:10px">'+
      '<b style="font-family:var(--display);font-size:13px;color:var(--expired)">'+dead.length+' expired — decide now</b>'+
      '<p class="note" style="margin:6px 0 11px">'+dead.map(i=>i.name).join(' · ')+'</p>'+
      '<div class="grid2"><button class="btn" data-act="keepAll">Still good, +3 days</button>'+
      '<button class="btn btn-dng" data-act="tossAll">Toss &amp; log waste</button></div></div>':'')+
    (urgent.length?'<div class="sec" style="color:var(--soon)">Eat these first<span class="count">'+urgent.length+'</span></div>'+
      urgent.slice(0,4).map(itemRow).join(''):'')+
    '<div class="sec">Recipes from what you have</div>'+
    scored.slice(0,5).map(r=>
      '<div class="recipe"><div class="row" style="align-items:flex-start">'+
        '<div class="remoji">'+r.e+'</div>'+
        '<div style="flex:1;min-width:0"><h4>'+r.n+'</h4><div class="note">'+r.m+' min · '+r.b+'</div></div>'+
        (r.rescue?'<span class="tag warn">SAVES '+r.rescue+'</span>':'')+'</div>'+
      '<div class="ings">'+r.ing.map(n=>{
          const it=byName[n];
          if(!it)return '<span class="ing miss">'+n+'</span>';
          const s=statusOf(it);
          return '<span class="ing '+(s==='soon'?'use':s==='expired'?'bad':'')+'">'+n+'</span>';
        }).join('')+'</div>'+
      '<div class="grid2"><button class="btn" data-radd="'+r.n+'">Add missing</button>'+
      '<button class="btn btn-pri" data-recipe="'+r.n+'">Cook this</button></div></div>').join('');
}

function viewList(){
  const lows=state.items.filter(isLow).filter(i=>!state.list.some(l=>l.name===i.name));
  const gone=state.items.filter(i=>statusOf(i)==='expired').filter(i=>!state.list.some(l=>l.name===i.name));
  const sugg=[...lows,...gone];
  const open=state.list.filter(l=>!l.done),done=state.list.filter(l=>l.done);
  const row=l=>'<div class="lrow'+(l.done?' done':'')+'">'+
    '<button class="check" data-toggle="'+l.id+'" aria-label="Mark bought">'+(l.done?'✓':'')+'</button>'+
    '<span class="ln">'+l.name+(l.auto?' <span class="tag">AUTO</span>':'')+'</span>'+
    '<span class="stepper"><button data-lq="-'+l.id+'">−</button><b>'+l.qty+'</b><button data-lq="+'+l.id+'">+</button></span>'+
    '<button data-del="'+l.id+'" style="color:var(--dim);font-size:16px" aria-label="Remove">×</button></div>';

  return '<h1 class="h1">Shopping list</h1>'+
    '<p class="sub">'+open.length+' to buy · built from what ran out and what you tossed.</p>'+
    (sugg.length?'<div class="card" style="margin-bottom:14px">'+
      '<div class="row" style="justify-content:space-between;margin-bottom:9px">'+
      '<b style="font-family:var(--display);font-size:13px">Suggested</b>'+
      '<button class="chip" data-act="addAllLow">Add all '+sugg.length+'</button></div>'+
      sugg.map(i=>'<div class="kvl"><span style="color:var(--text)">'+i.name+'</span>'+
        '<span style="display:flex;align-items:center;gap:10px"><span class="note">'+
        (isLow(i)?('only '+qtyTxt(i)+' left'):'expired')+'</span>'+
        '<button class="chip" data-add="'+i.id+'">Add</button></span></div>').join('')+
      '</div>':'')+
    '<div class="sec">To buy<span class="count">'+open.length+'</span></div>'+
    (open.length?open.map(row).join(''):'<p class="note">List is empty — you are fully stocked.</p>')+
    (done.length?'<div class="sec">In the basket<span class="count">'+done.length+'</span></div>'+done.map(row).join(''):'')+
    '<div class="grid2" style="margin-top:12px"><button class="btn" data-act="shareList">Share</button>'+
    '<button class="btn btn-pri" data-act="checkout">Trip complete</button></div>';
}

function viewInsights(){
  const max=Math.max(...state.history,3);
  const weeks=['W1','W2','W3','W4','W5','W6','W7','Now'];
  const chart=state.history.map((v,i)=>{
    const h=Math.max(5,v/max*100);
    const cls=v===0?'good':(v>=3?'hot':'');
    return '<div class="bar"><div class="f '+cls+'" style="height:'+h+'%"></div><span>'+weeks[i]+'</span></div>';
  }).join('');
  const cats={};
  state.items.forEach(i=>{cats[i.cat]=(cats[i.cat]||0)+i.price;});
  const catArr=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const catMax=catArr[0]?catArr[0][1]:1;
  const rate=Math.round(state.tossed/(state.saved+state.tossed)*100);

  return '<h1 class="h1">Your kitchen</h1>'+
    '<p class="sub">Since you mounted the bar, 11 weeks ago.</p>'+
    '<div class="grid2" style="margin-bottom:8px">'+
      '<div class="stat"><div class="n" style="color:var(--fresh)">'+money(state.saved)+'</div><div class="l">Eaten before it turned</div></div>'+
      '<div class="stat"><div class="n" style="color:var(--expired)">'+money(state.tossed)+'</div><div class="l">Thrown away</div></div></div>'+
    '<div class="stat" style="margin-bottom:8px">'+
      '<div class="n">'+rate+'%</div><div class="l">Waste rate — household average is 23%</div>'+
      '<div class="meter"><i style="width:'+(100-rate)+'%"></i></div></div>'+
    '<div class="card"><div class="row" style="justify-content:space-between">'+
      '<b style="font-family:var(--display);font-size:13.5px">12-day zero-waste streak</b>'+
      '<span class="tag">BEST: 19</span></div></div>'+
    '<div class="sec">Items wasted per week</div><div class="card"><div class="chart">'+chart+'</div></div>'+
    '<div class="sec">Where your fridge money sits</div><div class="card">'+
      catArr.map(([k,v])=>'<div style="margin-bottom:11px"><div class="row" style="justify-content:space-between;font-size:var(--t-meta)">'+
        '<span>'+k+'</span><span style="font-family:var(--display);font-weight:600">'+money(v)+'</span></div>'+
        '<div class="meter"><i style="width:'+(v/catMax*100)+'%"></i></div></div>').join('')+'</div>'+
    '<div class="sec">What Crisper has learned</div><div class="card">'+
      '<p class="note" style="margin:0 0 10px"><b style="color:var(--text)">Spinach dies here.</b> Binned 4 of the last 6 times. Buy the half-size bag.</p>'+
      '<p class="note" style="margin:0 0 10px"><b style="color:var(--text)">Milk runs out on Thursdays.</b> Auto-add it to the list every Wednesday?</p>'+
      '<p class="note" style="margin:0"><b style="color:var(--text)">Leftovers survive 1.8 days.</b> Now flagged at 48 hours.</p></div>'+
    '<div class="grid2" style="margin-top:12px"><button class="btn" data-act="export">Export report</button>'+
    '<button class="btn" data-act="compare">Compare</button></div>';
}

const sheet=$('sheet'),backdrop=$('backdrop');
function openSheet(html){sheet.innerHTML='<div class="handle"></div>'+html;sheet.classList.add('on');
  backdrop.classList.add('on');sheet.scrollTop=0;bindSheet();}
function closeSheet(){sheet.classList.remove('on');backdrop.classList.remove('on');}
backdrop.onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

function itemSheet(id){
  const it=state.items.find(i=>i.id===id); if(!it)return;
  const st=statusOf(it),d=daysLeft(it),exp=new Date(it.expires);
  openSheet(
    '<div class="row" style="gap:14px;margin-bottom:14px">'+
      '<span class="ring lg" style="--p:'+pct(it)+';--c:'+COLOR[st]+'"><em>'+it.emoji+'</em></span>'+
      '<div style="min-width:0"><h3>'+it.name+'</h3>'+
      '<div class="note">'+it.cat+' · '+it.zone+' · '+qtyTxt(it)+'</div>'+
      '<div style="margin-top:6px;font-family:var(--display);font-size:16px;font-weight:700;color:'+COLOR[st]+'">'+
        (st==='expired'?'Expired '+dayLabel(d).toLowerCase():dayLabel(d))+'</div></div></div>'+
    '<div class="card" style="margin-bottom:12px">'+
      '<div class="kvl"><span>Best before</span><b>'+exp.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</b></div>'+
      '<div class="kvl"><span>Scanned in</span><b>'+new Date(it.added).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</b></div>'+
      '<div class="kvl"><span>Shelf life</span><b>'+it.shelf+' days</b></div>'+
      '<div class="kvl"><span>You use</span><b>~'+it.use+' '+it.unit+'/week</b></div>'+
      '<div class="kvl"><span>Ideal stock</span><b>'+it.par+' '+it.unit+(isLow(it)?' · low':'')+'</b></div>'+
      '<div class="kvl"><span>Value</span><b>'+money(it.price)+'</b></div></div>'+
    '<div class="kvl" style="border:0;padding:0 0 12px"><span>Quantity</span>'+
      '<span class="stepper"><button data-iq="-'+it.id+'">−</button>'+
      '<b>'+(Math.round(it.qty*100)/100)+' '+it.unit+'</b>'+
      '<button data-iq="+'+it.id+'">+</button></span></div>'+
    '<div class="note" style="margin-bottom:7px">Move shelf</div>'+
    '<div class="chips" style="margin-bottom:14px">'+
      ZONES.map(z=>'<button class="chip" data-move="'+it.id+'|'+z+'" aria-pressed="'+(it.zone===z)+'">'+z+'</button>').join('')+'</div>'+
    '<div class="grid2" style="margin-bottom:8px">'+
      '<button class="btn" data-ext="'+it.id+'">Looks fine · +3 days</button>'+
      '<button class="btn" data-open="'+it.id+'">Mark opened</button></div>'+
    '<div class="grid2"><button class="btn btn-pri" data-used="'+it.id+'">Finished it</button>'+
      '<button class="btn btn-dng" data-toss="'+it.id+'">Threw it out</button></div>'+
    '<p class="note" style="margin-top:12px">Every action teaches Crisper how fast your household really gets through this.</p>'
  );
}

function alertsSheet(){
  const exp=state.items.filter(i=>statusOf(i)==='expired');
  const soon=state.items.filter(i=>{const d=daysLeft(i);return d>=0&&d<=1;});
  const low=state.items.filter(isLow);
  const block=(title,color,arr,msg)=>arr.length?
    '<div class="sec flat" style="color:'+color+'">'+title+'<span class="count">'+arr.length+'</span></div>'+
    arr.map(i=>'<div class="lrow"><span class="ln">'+i.name+
      '<div class="note">'+msg(i)+'</div></span>'+
      '<button class="chip" data-item="'+i.id+'">Open</button></div>').join(''):'';
  openSheet('<h3>Alerts</h3><p class="note" style="margin:0 0 4px">Pushed to everyone in the household, and mirrored on the bar\u2019s LED ring.</p>'+
    block('Expired','var(--expired)',exp,i=>'Went off '+dayLabel(daysLeft(i)).toLowerCase())+
    block('Today & tomorrow','var(--soon)',soon,i=>'Best before '+dayLabel(daysLeft(i)).toLowerCase())+
    block('Running low','var(--accent)',low,i=>'Only '+qtyTxt(i)+' left of '+i.par+' '+i.unit)+
    (!exp.length&&!soon.length&&!low.length?'<div class="empty"><div class="e">✓</div>All clear.</div>':'')
  );
}

function settingsSheet(){
  openSheet('<h3>Settings</h3>'+
    '<div class="sec flat">The Crisper Bar</div>'+
    '<div class="device"><span class="beam"></span><span class="lens"></span><span class="led"></span><span class="mark">CRISPER</span></div>'+
    '<div class="card" style="margin-top:10px">'+
      '<div class="kvl"><span>Connection</span><b class="ok">Wi-Fi strong</b></div>'+
      '<div class="kvl"><span>Battery</span><b>82% · ~6 wks</b></div>'+
      '<div class="kvl"><span>Last sync</span><b>2 min ago</b></div>'+
      '<div class="kvl"><span>Items tracked</span><b>'+state.items.length+' items</b></div>'+
      '<div class="kvl"><span>Firmware</span><b>1.4.2</b></div>'+
      '<div class="kvl"><span>Beep volume</span><b>Low</b></div>'+
      '<div class="kvl"><span>LED ring mirror</span><b class="ok">On</b></div></div>'+

    '<div class="sec flat">How it works</div><div class="card">'+
      '<div class="step"><b>01</b><p><b>Mount.</b> Magnetic bar clips to the fridge door at hand height. No tools, no wiring.</p></div>'+
      '<div class="step"><b>02</b><p><b>Scan in.</b> Wave each barcode past the lens as you unpack. No barcode? Use the quick-pick grid.</p></div>'+
      '<div class="step"><b>03</b><p><b>Scan out.</b> A second beep on the way out decrements the count — that\u2019s how Crisper knows what\u2019s running low.</p></div>'+
      '<div class="step"><b>04</b><p><b>Watch the colours.</b> Shelf-life data plus your own usage history set every expiry date automatically.</p></div></div>'+

    '<div class="sec flat">Freshness thresholds</div><div class="card">'+
      '<div class="kvl" style="border:0;padding:0 0 8px"><span>Turn amber when an item has</span>'+
      '<b style="color:var(--soon)">'+state.soonDays+' days left</b></div>'+
      '<input type="range" id="soonRange" min="1" max="10" value="'+state.soonDays+'" aria-label="Amber threshold">'+
      '<div class="legend"><i style="background:var(--fresh)"></i><div><b>Green</b> — more than '+state.soonDays+' days left</div></div>'+
      '<div class="legend"><i style="background:var(--soon)"></i><div><b>Amber</b> — '+state.soonDays+' days or fewer, use it now</div></div>'+
      '<div class="legend"><i style="background:var(--expired)"></i><div><b>Red</b> — past date, check or toss</div></div>'+
      '<p class="note measure" style="margin:8px 0 0">One number drives the rings, the Rescue tab, the alerts and the LED on the bar.</p></div>'+

    '<div class="sec flat">Notifications</div><div class="card">'+
      '<div class="kvl"><span>Daily 6pm digest</span><b class="ok">On</b></div>'+
      '<div class="kvl"><span>Instant expiry alert</span><b class="ok">On</b></div>'+
      '<div class="kvl"><span>Low-stock reminders</span><b class="ok">On</b></div>'+
      '<div class="kvl"><span>Weekly waste report</span><b>Sundays</b></div></div>'+

    '<div class="sec flat">Household</div><div class="card">'+
      '<div class="kvl"><span>Owner</span><b>All access</b></div>'+
      '<div class="kvl"><span>Member 2</span><b>Scan + list</b></div>'+
      '<div class="kvl"><span>Shared list sync</span><b class="ok">Live</b></div></div>'+
    '<button class="btn" style="margin-top:14px" data-act="closeSheet">Done</button>'
  );
}

function labSheet(){
  const c={fresh:0,soon:0,expired:0};
  state.items.forEach(i=>c[statusOf(i)]++);
  const low=state.items.filter(isLow).length;
  const val=state.items.reduce((s,i)=>s+i.price*Math.min(1,i.qty/(i.par||1)),0);
  const d=new Date(now());
  openSheet('<h3>Time machine</h3>'+
    '<p class="note measure" style="margin:0 0 14px">Drag to fast-forward the household clock and watch the rings drain from green to red.</p>'+
    '<div class="tm-head"><b>'+(state.offset===0?'Today':'+'+state.offset+' day'+(state.offset>1?'s':''))+'</b>'+
      '<span>'+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+'</span></div>'+
    '<input type="range" id="timeSlider" min="0" max="21" step="1" value="'+state.offset+'" aria-label="Days into the future">'+
    '<div class="ticks"><span>NOW</span><span>+7D</span><span>+14D</span><span>+21D</span></div>'+
    '<div class="scn">'+
      '<button data-scn="week"><i>🗓</i>Skip ahead one week</button>'+
      '<button data-scn="vacation"><i>✈️</i>Two weeks away (vacation mode)</button>'+
      '<button data-scn="shop"><i>🛍</i>Big shop — scan in 5 items</button>'+
      '<button data-scn="reset"><i>↺</i>Reset the demo</button></div>'+
    '<div class="sec flat">Live tally</div><div class="card">'+
      '<div class="kvl"><span style="color:var(--fresh)">Fresh</span><b>'+c.fresh+'</b></div>'+
      '<div class="kvl"><span style="color:var(--soon)">Use soon</span><b>'+c.soon+'</b></div>'+
      '<div class="kvl"><span style="color:var(--expired)">Expired</span><b>'+c.expired+'</b></div>'+
      '<div class="kvl"><span>Running low</span><b>'+low+'</b></div>'+
      '<div class="kvl"><span>Fridge value</span><b>'+money(val)+'</b></div></div>'+
    '<p class="note" style="margin-top:12px">Prototype tool — this would not ship in the consumer app.</p>'
  );
}

function toast(msg){
  const t=document.createElement('div');
  t.className='toast';t.textContent=msg;
  $('toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.25s';t.style.opacity='0';},1900);
  setTimeout(()=>t.remove(),2200);
}
function logScan(t,d){state.log.unshift({t,d,ago:'just now'});state.log=state.log.slice(0,6);}

function startScan(){
  if(state.scanning)return;
  if(state.scanMode==='out'){
    const pool=state.items.filter(i=>i.qty>0);
    if(!pool.length){toast('Fridge is empty');return;}
    state.scanning=true;render();
    setTimeout(()=>{
      const it=pool[Math.floor(Math.random()*pool.length)];
      const step=it.unit==='g'?100:(it.qty>=2?1:0.5);
      it.qty=Math.max(0,Math.round((it.qty-step)*100)/100);
      logScan(it.name,'taken out');
      if(it.qty===0){state.items=state.items.filter(x=>x.id!==it.id);
        toast(it.name+' finished — added to list');addToList(it,true);}
      else toast(it.name+' → '+qtyTxt(it)+' left');
      state.scanning=false;render();
    },800);
    return;
  }
  state.scanning=true;render();
  setTimeout(()=>{
    const c=CATALOG[Math.floor(Math.random()*CATALOG.length)];
    state.pending={name:c[0],emoji:c[1],cat:c[2],zone:c[3],qty:c[4],unit:c[5],par:c[6],days:c[7],
      price:c[8],code:'0'+Math.floor(10000000000+Math.random()*8e10)};
    state.scanning=false;render();
  },850);
}

function confirmScan(){
  const p=state.pending; if(!p)return;
  const existing=state.items.find(i=>i.name===p.name);
  if(existing){
    existing.qty=Math.round((existing.qty+p.qty)*100)/100;
    existing.expires=T0+state.offset*DAY+p.days*DAY+DAY-1;
    existing.fresh=true;
    toast(p.name+' restocked');
  } else {
    const it=makeItem([p.name,p.emoji,p.cat,p.zone,p.qty,p.unit,p.par,p.days+state.offset,Math.max(p.days,1),p.price,1]);
    it.fresh=true;it.added=now();
    state.items.push(it);
    toast(p.name+' added · best before in '+p.days+' days');
  }
  logScan(p.name,'scanned in');
  state.list=state.list.filter(l=>l.name.toLowerCase()!==p.name.toLowerCase());
  state.pending=null;render();
}

function quickAdd(name){
  const c=CATALOG.find(x=>x[0]===name); if(!c)return;
  state.pending={name:c[0],emoji:c[1],cat:c[2],zone:c[3],qty:c[4],unit:c[5],par:c[6],days:c[7],
    price:c[8],code:'manual entry'};
  render();
}

function addToList(it,silent){
  if(state.list.some(l=>l.name===it.name))return;
  state.list.push({id:'l'+Math.random().toString(36).slice(2,7),name:it.name,qty:1,auto:true,done:false});
  if(!silent)toast(it.name+' added to list');
}
function consume(it,amount){
  it.qty=Math.max(0,Math.round((it.qty-amount)*100)/100);
  if(it.qty===0){state.items=state.items.filter(x=>x.id!==it.id);addToList(it,true);}
}
function cook(name){
  const r=RECIPES.find(x=>x.n===name); if(!r)return;
  let used=0,saved=0;
  r.ing.forEach(n=>{
    const it=state.items.find(i=>i.name===n); if(!it)return;
    const amt=it.unit==='g'?200:(it.qty>=2?1:it.qty);
    if(statusOf(it)==='soon')saved+=it.price*0.5;
    consume(it,amt);used++;
  });
  state.saved+=saved;closeSheet();
  toast(name+' cooked · '+used+' items used, '+money(saved)+' rescued');
  state.tab='fridge';render();
}
function setTab(t){state.tab=t;closeSheet();screen.scrollTop=0;render();}

function bindScreen(){
  screen.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>itemSheet(+b.dataset.item));
  screen.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{
    state.filter=(state.filter===b.dataset.filter&&b.dataset.filter!=='all')?'all':b.dataset.filter;render();});
  screen.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{state.group=b.dataset.group;render();});
  screen.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{state.scanMode=b.dataset.mode;state.pending=null;render();});
  screen.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>quickAdd(b.dataset.quick));
  screen.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{state.pending.zone=b.dataset.zone;render();});
  screen.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>cook(b.dataset.recipe));
  screen.querySelectorAll('[data-radd]').forEach(b=>b.onclick=()=>{
    const r=RECIPES.find(x=>x.n===b.dataset.radd);
    let n=0;r.ing.forEach(ing=>{if(!state.items.some(i=>i.name===ing)){addToList({name:ing},true);n++;}});
    toast(n?n+' ingredient'+(n>1?'s':'')+' added to list':'You have everything already');render();});
  const q=$('q');
  if(q)q.oninput=e=>{state.q=e.target.value;const p=e.target.selectionStart;render();
    const n2=$('q');if(n2){n2.focus();n2.setSelectionRange(p,p);}};
  screen.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{
    const p=state.pending,k=b.dataset.p;
    if(k==='qty+')p.qty=Math.round((p.qty+(p.unit==='g'?100:1))*100)/100;
    if(k==='qty-')p.qty=Math.max(p.unit==='g'?100:1,p.qty-(p.unit==='g'?100:1));
    if(k==='exp+')p.days++;
    if(k==='exp-')p.days=Math.max(0,p.days-1);
    render();});
  screen.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
    const l=state.list.find(x=>x.id===b.dataset.toggle);l.done=!l.done;render();});
  screen.querySelectorAll('[data-lq]').forEach(b=>b.onclick=()=>{
    const s=b.dataset.lq,l=state.list.find(x=>x.id===s.slice(1));
    l.qty=Math.max(1,l.qty+(s[0]==='+'?1:-1));render();});
  screen.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    state.list=state.list.filter(x=>x.id!==b.dataset.del);render();});
  screen.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    addToList(state.items.find(i=>i.id===+b.dataset.add));render();});
  screen.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
}

function bindSheet(){
  sheet.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>itemSheet(+b.dataset.item));
  sheet.querySelectorAll('[data-iq]').forEach(b=>b.onclick=()=>{
    const s=b.dataset.iq,it=state.items.find(i=>i.id===+s.slice(1)); if(!it)return;
    const step=it.unit==='g'?50:(it.qty>=2?1:0.5);
    it.qty=Math.max(0,Math.round((it.qty+(s[0]==='+'?step:-step))*100)/100);
    itemSheet(it.id);render();});
  sheet.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>{
    const [id,z]=b.dataset.move.split('|');const it=state.items.find(i=>i.id===+id);
    it.zone=z;itemSheet(it.id);render();toast(it.name+' moved to '+z);});
  sheet.querySelectorAll('[data-ext]').forEach(b=>b.onclick=()=>{
    const it=state.items.find(i=>i.id===+b.dataset.ext);it.expires+=3*DAY;
    itemSheet(it.id);render();toast('+3 days on '+it.name);});
  sheet.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    const it=state.items.find(i=>i.id===+b.dataset.open);
    it.expires=Math.min(it.expires,now()+4*DAY);it.shelf=Math.min(it.shelf,7);
    itemSheet(it.id);render();toast(it.name+' marked opened');});
  sheet.querySelectorAll('[data-used]').forEach(b=>b.onclick=()=>{
    const it=state.items.find(i=>i.id===+b.dataset.used);
    state.saved+=it.price;state.items=state.items.filter(x=>x.id!==it.id);
    addToList(it,true);closeSheet();render();toast(it.name+' finished · '+money(it.price)+' saved');});
  sheet.querySelectorAll('[data-toss]').forEach(b=>b.onclick=()=>{
    const it=state.items.find(i=>i.id===+b.dataset.toss);
    state.tossed+=it.price;state.history[7]++;state.items=state.items.filter(x=>x.id!==it.id);
    addToList(it,true);closeSheet();render();toast(it.name+' logged as waste · '+money(it.price));});
  sheet.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  sheet.querySelectorAll('[data-scn]').forEach(b=>b.onclick=()=>scenario(b.dataset.scn));

  const sr=$('soonRange');
  if(sr)sr.oninput=e=>{state.soonDays=+e.target.value;const v=e.target.value;settingsSheet();
    const n2=$('soonRange');if(n2){n2.value=v;n2.focus();}render();};
  const ts=$('timeSlider');
  if(ts)ts.oninput=e=>{state.offset=+e.target.value;const v=e.target.value;labSheet();
    const n2=$('timeSlider');if(n2){n2.value=v;n2.focus();}render();};
}

function scenario(s){
  if(s==='week'){state.offset=Math.min(21,state.offset+7);toast('One week later — check the Rescue tab');}
  if(s==='vacation'){state.offset=14;toast('Back from vacation. This is the cost of not knowing.');}
  if(s==='shop'){
    let n=0;const go=()=>{if(n++>=5)return;
      const c=CATALOG[Math.floor(Math.random()*CATALOG.length)];
      state.pending={name:c[0],emoji:c[1],cat:c[2],zone:c[3],qty:c[4],unit:c[5],par:c[6],days:c[7],price:c[8],code:'auto'};
      confirmScan();setTimeout(go,180);};
    state.tab='fridge';go();closeSheet();toast('Big shop unpacked');render();return;}
  if(s==='reset'){seed();state.tab='fridge';closeSheet();toast('Demo reset');render();return;}
  labSheet();render();
}

function act(a){
  if(a==='scan')startScan();
  if(a==='burst'){let n=0;const go=()=>{if(n++>=3)return;startScan();
    setTimeout(()=>{if(state.pending)confirmScan();setTimeout(go,220);},950);};go();}
  if(a==='confirmScan')confirmScan();
  if(a==='cancelScan'){state.pending=null;render();toast('Scan discarded');}
  if(a==='addAllLow'){
    const t=[...state.items.filter(isLow),...state.items.filter(i=>statusOf(i)==='expired')];
    t.forEach(i=>addToList(i,true));toast(t.length+' items added to the list');render();}
  if(a==='tossAll'){
    const dead=state.items.filter(i=>statusOf(i)==='expired');
    let v=0;dead.forEach(i=>{v+=i.price;state.history[7]++;addToList(i,true);});
    state.tossed+=v;state.items=state.items.filter(i=>statusOf(i)!=='expired');
    toast(dead.length+' tossed · '+money(v)+' logged as waste');render();}
  if(a==='keepAll'){
    state.items.filter(i=>statusOf(i)==='expired').forEach(i=>i.expires=now()+3*DAY+DAY-1);
    toast('Expired items given 3 more days');render();}
  if(a==='checkout'){
    const bought=state.list.filter(l=>l.done).length;
    state.list=state.list.filter(l=>!l.done);
    toast(bought?bought+' items bought — ready to unpack':'Tick items off first');
    state.tab='scan';render();}
  if(a==='shareList')toast('List link copied — partner can edit live');
  if(a==='export')toast('Report emailed as PDF');
  if(a==='compare')toast('You waste 42% less than similar households');
  if(a==='device')settingsSheet();
  if(a==='closeSheet')closeSheet();
}

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setTab(t.dataset.tab));
$('bellBtn').onclick=alertsSheet;
$('gearBtn').onclick=settingsSheet;
$('labBtn').onclick=labSheet;

render();
</script>
